AllCops:
  NewCops: enable
  # RuboCop 1.31 only knows versions through 3.2. The gem itself requires 3.3.
  TargetRubyVersion: 3.2

Style/Documentation:
  Enabled: false

Lint/DuplicateMethods:
  Exclude:
    - 'lib/**/configure.rb'

Gemspec/RequireMFA:
  Enabled: false

# RuboCop 1.31 cannot set TargetRubyVersion to 3.3, so this cop cannot match required_ruby_version.
Gemspec/RequiredRubyVersion:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'
    - 'easy_access_gpt.gemspec'
  IgnoredMethods:
    - describe
    - context
