AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2

Style/Documentation:
  Enabled: false

Lint/DuplicateMethods:
  Exclude:
    - 'lib/**/configure.rb'

Gemspec/RequireMFA:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'
    - 'easy_access_gpt.gemspec'
  IgnoredMethods:
    - describe
    - context
